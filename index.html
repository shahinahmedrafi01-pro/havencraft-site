<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>
<meta name="description" content="Life is short focus on what truly matters, grow daily, and leave a positive impact.">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="theme-color" content="#0a0a10">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://mc-heads.net" crossorigin>
<link rel="preload" as="image" href="https://mc-heads.net/skin/alxxq" crossorigin="anonymous" fetchpriority="high">
<script>
/* Apply saved theme before first paint (default: dark) */
(function(){try{var t=localStorage.getItem('rafiprx-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<script>
/* Entry gate state before first paint: visitors who already entered in this
   tab session skip the Entry Page; everyone else sees it first. */
(function(){try{if(sessionStorage.getItem('rafiprx-entered')==='1'){document.documentElement.classList.add('entered');}else{document.documentElement.classList.add('gated');}}catch(e){document.documentElement.classList.add('gated');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a0a10;
    --bg2:#14101f;
    --ink:#f5f3fb;
    --muted:#a49ec0;
    --accent:#a855f7;
    --accent2:#c084fc;
    --glass:rgba(26,22,46,.34);
    --glass-brd:rgba(168,85,247,.32);
    --glass-hi:rgba(40,34,72,.50);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --glow1:rgba(147,51,234,.22);
    --glow2:rgba(147,51,234,.12);
    --cube-brd:rgba(168,85,247,.28);
    --cube-bg:linear-gradient(145deg,rgba(168,85,247,.16),rgba(168,85,247,.03));
    --focus:#d8b4fe;
    --bgwash:linear-gradient(180deg, rgba(7,4,16,.50), rgba(7,4,16,.64));
    --glassbox:rgba(24,16,46,.16);
    --glassbox-hi:rgba(40,28,72,.30);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#faf6ee;
    --bg2:#f1e9da;
    --ink:#2c2140;
    --muted:#6f6484;
    --accent:#9333ea;
    --accent2:#a855f7;
    --glass:rgba(255,255,255,.45);
    --glass-brd:rgba(147,51,234,.30);
    --glass-hi:rgba(255,255,255,.62);
    --shadow:0 10px 26px rgba(76,50,120,.15);
    --glow1:rgba(147,51,234,.14);
    --glow2:rgba(147,51,234,.07);
    --cube-brd:rgba(147,51,234,.25);
    --cube-bg:linear-gradient(145deg,rgba(147,51,234,.12),rgba(147,51,234,.03));
    --focus:#7e22ce;
    /* light wash over the new bright scenes — light enough that the photos stay visible */
    --bgwash:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.42));
    --glassbox:rgba(255,255,255,.22);
    --glassbox-hi:rgba(255,255,255,.40);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(640px 420px at 88% -6%, var(--glow1), transparent 62%),
      radial-gradient(760px 540px at -12% 104%, var(--glow2), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    transition:background .35s ease, color .35s ease;
  }

  /* ---------- scenic background (the owner's two artworks) ----------
     Phones — including phone desktop mode — get the portrait scene;
     large PC screens get the wide scene. cover-fit only: the artwork is
     never stretched or distorted. A theme wash above it keeps the glass
     UI readable in each theme. */
  body::before{
    content:"";position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;z-index:0;pointer-events:none;
    background:url('./bg-mobile.webp') center 30%/cover no-repeat;
  }
  body::after{
    content:"";position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;z-index:0;pointer-events:none;
    background:var(--bgwash);
  }
  @media (orientation:landscape) and (max-width:1099px){
    body::before{background-position:center 32%}
  }
  /* large screens get the wide scene: real PCs match pointer:fine; the
     aspect-ratio arm covers pointer-less environments. Phones in desktop
     mode report a <1100px viewport, so they keep the portrait scene. */
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    body::before{background-image:url('./bg-desktop.webp');background-position:center}
  }
  /* light theme uses the owner's new bright scenes; dark keeps the current scenes — never mixed */
  :root[data-theme="light"] body::before{background-image:url('./bg-light-mobile.webp')}
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    :root[data-theme="light"] body::before{background-image:url('./bg-light-desktop.webp')}
  }

  /* decorative glass cubes — light, mostly static */
  .bg{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;overflow:hidden;z-index:0;pointer-events:none}
  .cube{position:absolute;border-radius:16px;background:var(--cube-bg);border:1px solid var(--cube-brd);box-shadow:var(--shadow);opacity:.5}
  .cube::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 45%)}
  .cube.c1{width:110px;height:110px;top:9%;left:5%;transform:rotate(14deg)}
  .cube.c2{width:64px;height:64px;top:63%;left:8%;transform:rotate(-10deg)}
  .cube.c3{width:140px;height:140px;top:14%;right:6%;transform:rotate(-16deg)}
  .cube.c4{width:74px;height:74px;bottom:8%;right:10%;transform:rotate(22deg)}
  .cube.c5{width:44px;height:44px;top:46%;left:2.5%;transform:rotate(28deg)}
  @keyframes drift{from{margin-top:0}to{margin-top:14px}}
  .cube.c1,.cube.c3{animation:drift 13s ease-in-out infinite alternate}

  .card{position:relative;z-index:1;width:100%;max-width:620px;margin:0 auto;text-align:center;padding:clamp(72px,8vh,76px) 22px 72px}

  /* ---------- 3D avatar: fixed overlay, displayed at 40% via scale ---------- */
  .avatar-wrap{position:relative;height:240px} /* spacer: keeps quote/links exactly where they are */
  .skin-viewer{width:min(74vw,290px);height:372px;margin:0;position:fixed;left:0;top:0;z-index:40;transform-origin:0 0}
  .skin-viewer .skin-ph{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:125px;height:125px;border-radius:22px;pointer-events:none;display:none;animation:phPulse 1.6s ease-in-out infinite}
  @keyframes phPulse{0%,100%{opacity:.55}50%{opacity:1}}
  .skin-viewer canvas{width:100%;height:100%;display:block;cursor:grab;border-radius:18px}
  .skin-viewer canvas:active{cursor:grabbing}
  .skin-note{color:var(--muted);font-size:.9rem;padding:24px 10px}

  h1{font-size:clamp(1.35rem,4.6vw,1.9rem);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:26px 0 30px}

  /* ---------- glass contact shortcuts ---------- */

  /* ---------- glass social pills ---------- */
  .pills{display:flex;flex-direction:column;gap:14px;margin-top:38px}
  .pill{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;text-decoration:none;color:var(--ink);font-weight:600;font-size:1.05rem;background:var(--glassbox);backdrop-filter:blur(8px) saturate(1.25);-webkit-backdrop-filter:blur(8px) saturate(1.25);border-radius:16px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(147,51,234,.25));transition:transform .18s ease,background .18s ease}
  .pill::before{content:"";position:absolute;inset:0;padding:1px;background:linear-gradient(120deg,rgba(192,132,252,.95),rgba(147,51,234,.55) 50%,rgba(192,132,252,.95));border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
  .pill>*{position:relative;z-index:1}
  .pill:hover{transform:translateY(-2px);background:var(--glassbox-hi)}
  .pill:active{transform:scale(.985)}
  .pill svg{width:26px;height:26px;fill:var(--accent2);flex:0 0 26px}
  /* contact row: two separate rounded pills (Call | Email) */
  .contact-split{display:flex;gap:14px;margin-top:14px}
  .contact-half{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:1.05rem;background:var(--glassbox);backdrop-filter:blur(8px) saturate(1.25);-webkit-backdrop-filter:blur(8px) saturate(1.25);border-radius:16px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(147,51,234,.25));transition:transform .18s ease,background .18s ease}
  .contact-half::before{content:"";position:absolute;inset:0;padding:1px;background:linear-gradient(120deg,rgba(192,132,252,.95),rgba(147,51,234,.55) 50%,rgba(192,132,252,.95));border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
  .contact-half>*{position:relative;z-index:1}
  .contact-half:hover{transform:translateY(-2px);background:var(--glassbox-hi)}
  .contact-half:active{transform:scale(.985)}
  .contact-half svg{width:24px;height:24px;fill:var(--accent2);flex:0 0 24px}
  .contact-half svg[fill="none"]{fill:none;stroke:var(--accent2)}

  a:focus-visible, button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

  /* ---------- top bar + panels ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .topbar-btn{position:relative;width:40px;height:40px;border-radius:14px;background:transparent;border:0;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s ease;flex:0 0 40px}
  .topbar-btn:active{transform:scale(.94)}
  .topbar-btn svg{width:22px;height:22px}
  /* theme icon morph: moon and sun crossfade + rotate + scale, slowly */
  .theme-toggle svg{position:absolute;inset:0;margin:auto;transition:opacity .45s ease,transform .45s ease}
  .theme-toggle .ic-moon{opacity:1;transform:rotate(0deg) scale(1)}
  .theme-toggle .ic-sun{opacity:0;transform:rotate(-90deg) scale(.5)}
  :root[data-theme="light"] .theme-toggle .ic-moon{opacity:0;transform:rotate(90deg) scale(.5)}
  :root[data-theme="light"] .theme-toggle .ic-sun{opacity:1;transform:rotate(0deg) scale(1)}
  /* music mute slash: sits exactly centered; drops down from above when muted, rises back up when unmuted */
  .music-btn .slash{position:absolute;left:50%;top:50%;width:28px;height:2.5px;margin-left:-14px;margin-top:-1.25px;background:currentColor;border-radius:2px;transform:translateY(-30px) rotate(45deg);opacity:0;transition:transform .45s ease,opacity .3s ease;pointer-events:none}
  .music-btn.muted .slash{transform:translateY(0) rotate(45deg);opacity:1}
  /* settings gear turns slightly when its panel opens */
  #settingsBtn svg{transition:transform .35s ease}
  #settingsBtn[aria-expanded="true"] svg{transform:rotate(45deg)}
  .settings{position:fixed;top:64px;right:12px;z-index:70;width:min(264px,82vw);background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left}
  .settings[hidden]{display:none}
  .nav-panel{position:fixed;top:64px;left:12px;z-index:70;width:min(264px,82vw);min-height:48px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);padding:14px}
  .nav-panel[hidden]{display:none}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
  .set-label{font-weight:600;font-size:.95rem}
  .set-note{font-size:.78rem;color:var(--muted);padding:4px 2px 0}
  .set-sep{height:1px;background:var(--glass-brd);margin:10px 0;opacity:.6}
  .switch{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--glass-brd);border-radius:999px;padding:5px 10px 5px 5px;cursor:pointer;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600}
  .switch .track{width:34px;height:19px;border-radius:999px;background:rgba(140,130,170,.35);position:relative;transition:background .2s ease;flex:0 0 34px}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .switch[aria-checked="true"] .track{background:var(--accent)}
  .switch[aria-checked="true"] .track::after{left:17px}
  .theme-opts{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:8px}
  .theme-opt{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:1px solid var(--glass-brd);border-radius:12px;padding:9px 12px;color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .18s ease}
  .theme-opt:hover{background:var(--glass-hi)}
  .theme-opt .check{color:var(--accent2);font-weight:800;visibility:hidden}
  .theme-opt[aria-checked="true"] .check{visibility:visible}
  .theme-opt[aria-checked="true"]{border-color:var(--accent)}
  .theme-name{display:inline-flex;align-items:center;gap:8px}
  .rec{font-size:.58rem;font-weight:700;letter-spacing:.04em;color:var(--accent2);background:rgba(168,85,247,.14);border:1px solid var(--glass-brd);padding:1px 6px;border-radius:999px}

  /* scroll reveal (kept from the original page) */
  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
  .rv.in{opacity:1;transform:none}
  .pills .pill:nth-child(2){transition-delay:.05s}
  .pills .pill:nth-child(3){transition-delay:.1s}
  .pills .pill:nth-child(4){transition-delay:.15s}
  .pills .pill:nth-child(5){transition-delay:.2s}

  @media (max-width:480px){
    .avatar-wrap{height:210px}
    .skin-viewer{height:336px}
    h1{margin:22px 0 26px}
  }
  @media (prefers-reduced-motion: reduce){
    .cube{animation:none}
    .skin-ph{animation:none}
    .rv{opacity:1;transform:none;transition:none}
    html{scroll-behavior:auto}
  }

  /* ================= Entry Page (mobile-first) =================
     A framed cinematic panel floating with margins on a near-black field —
     the artwork lives inside the frame, never edge-to-edge. Shown once per
     tab session; BEGIN THE JOURNEY closes it and starts the site music. */
  html.gated body{overflow:hidden}
  .entry{display:none}
  html.gated .entry{
    display:flex;align-items:center;justify-content:center;
    position:fixed;inset:0;z-index:200;
    padding:0;
    background:#040409;
    opacity:1;transition:opacity .5s ease;
  }
  .entry.leaving{opacity:0;pointer-events:none}
  .entry-frame{
    position:relative;width:100%;height:100%;
    border-radius:0;overflow:hidden;isolation:isolate;
    border:none;
    background:linear-gradient(165deg,#0d0718 0%,#050409 52%,#0a0514 100%);
    box-shadow:inset 0 0 120px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
  }
  /* --- original artwork: layered gradients + geometry, drawn in CSS --- */
  .entry-art{position:absolute;inset:0;z-index:0;overflow:hidden}
  /* the portrait scene fills the frame; a contrast wash keeps the quote
     and button perfectly readable over it */
  .entry-art::before{
    content:"";position:absolute;inset:0;
    background:url('./bg-mobile.webp') center 24%/cover no-repeat;
  }
  .entry-art::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(5,3,12,.14) 0%, rgba(5,3,12,.34) 40%, rgba(5,3,12,.55) 60%, rgba(5,3,12,.34) 100%);
  }
  /* on large PC screens the entry uses the wide scene, same as the page */
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    .entry-art::before{background-image:url('./bg-desktop.webp');background-position:center}
  }
  /* entry gate follows the theme too: light shows the new bright scenes */
  :root[data-theme="light"] .entry-art::before{background-image:url('./bg-light-mobile.webp')}
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    :root[data-theme="light"] .entry-art::before{background-image:url('./bg-light-desktop.webp')}
  }
  .entry-art .nebula{
    position:absolute;left:-32%;top:9%;width:165%;height:36%;
    transform:rotate(-31deg);opacity:.45;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(217,180,255,.34) 0%, rgba(168,85,247,.34) 34%, rgba(109,40,217,.16) 58%, transparent 74%);
    filter:blur(14px);
  }
  .entry-art .nebula.core{
    top:16.5%;height:13%;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(240,220,255,.5) 0%, rgba(192,132,252,.38) 42%, transparent 72%);
    filter:blur(7px);
  }
  .entry-art .nebula.low{
    top:auto;bottom:-4%;left:-20%;height:26%;opacity:.55;
    transform:rotate(-24deg);
  }
  .entry-art .dust{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 22% 30%, rgba(233,213,255,.75) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 71% 18%, rgba(233,213,255,.55) 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 84% 57%, rgba(216,180,254,.6) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 14% 68%, rgba(216,180,254,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 57% 84%, rgba(233,213,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 12%, rgba(233,213,255,.5) 50%, transparent 51%);
  }
  .entry-art .geo{position:absolute;border:1px solid rgba(192,132,252,.30)}
  .entry-art .geo.sq1{width:118px;height:118px;top:11%;right:-34px;transform:rotate(24deg)}
  .entry-art .geo.sq2{width:64px;height:64px;bottom:15%;left:-20px;transform:rotate(-14deg);border-color:rgba(192,132,252,.22)}
  .entry-art .geo.ring{width:150px;height:150px;border-radius:50%;bottom:-52px;right:-38px;border-color:rgba(192,132,252,.16)}
  .entry-art .geo.line{width:150%;height:0;border:none;border-top:1px solid rgba(192,132,252,.13);top:64%;left:-25%;transform:rotate(-31deg)}
  .entry-art .geo.dia{width:9px;height:9px;top:26%;left:16%;transform:rotate(45deg);background:rgba(192,132,252,.55);border:none;box-shadow:0 0 10px rgba(168,85,247,.8)}
  .entry-art .geo.dia.d2{top:auto;left:auto;bottom:24%;right:15%;width:7px;height:7px;opacity:.8}
  /* --- content --- */
  .entry-inner{position:relative;z-index:1;text-align:center;padding:34px 30px;max-width:340px}
  .entry-quote{
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    font-weight:500;font-size:clamp(1.78rem,7.4vw,2.25rem);line-height:1.38;
    letter-spacing:.015em;color:#f1eafd;text-wrap:balance;
    text-shadow:0 2px 26px rgba(147,51,234,.4);
    animation:entryRise .9s ease both .1s;
  }
  .entry-rule{
    width:44px;height:1px;margin:26px auto 30px;
    background:linear-gradient(90deg,transparent,rgba(216,180,254,.9),transparent);
    box-shadow:0 0 8px rgba(168,85,247,.7);
    animation:entryRise .9s ease both .25s;
  }
  .entry-btn-wrap{display:inline-block;filter:drop-shadow(0 0 16px rgba(147,51,234,.45));animation:entryRise .9s ease both .4s}
  .entry-btn{
    position:relative;display:inline-block;cursor:pointer;
    font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:.82rem;
    letter-spacing:.30em;text-indent:.30em;text-transform:uppercase;color:#ecd9ff;
    padding:17px 30px;border:none;
    background:var(--glassbox);
    backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);
    border-radius:16px;
    transition:filter .2s ease,background .2s ease;
  }
  .entry-btn::before{
    content:"";position:absolute;inset:0;padding:1px;
    background:linear-gradient(120deg,#a855f7,#7e22ce 55%,#a855f7);
    border-radius:inherit;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    pointer-events:none;
  }
  .entry-btn span{position:relative;z-index:1}
  .entry-btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(192,132,252,.9),0 0 24px rgba(168,85,247,.45)}
  .entry-btn:hover,.entry-btn:active{background:var(--glassbox-hi)}
  .entry-btn:active{filter:brightness(1.25)}

    if (!settingsMenu.hidden && !settingsMenu.contains(ev.target) && ev.target !== settingsBtn && !settingsBtn.contains(ev.target)) closePanel(settingsBtn, settingsMenu, false);
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && (!navMenu.hidden || !settingsMenu.hidden)) closeAllPanels(true);
  });
  navMenu.addEventListener('click', function(ev){ ev.stopPropagation(); });
  settingsMenu.addEventListener('click', function(ev){ ev.stopPropagation(); });

  /* ================= theme ================= */
  var themeOpts = document.querySelectorAll('[data-set-theme]');
  var themeToggleTop = document.getElementById('themeToggleTop');
  function reflectTheme(){
    var cur = document.documentElement.getAttribute('data-theme') || 'dark';
    themeOpts.forEach(function(b){
      b.setAttribute('aria-checked', b.getAttribute('data-set-theme') === cur ? 'true' : 'false');
    });
    if (themeToggleTop) themeToggleTop.setAttribute('aria-label', cur === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }
  themeOpts.forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.getAttribute('data-set-theme');
      document.documentElement.setAttribute('data-theme', t);
      store('rafiprx-theme', t);
      reflectTheme();
      closePanel(settingsBtn, settingsMenu, false);
    });
  });
  themeToggleTop.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') || 'dark';
    var t = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    store('rafiprx-theme', t);
    reflectTheme();
  });
  reflectTheme();

  /* ================= background music ================= */
  var audio = document.getElementById('bgMusic');
  audio.src = MUSIC_SRC;
  audio.volume = 0.5;
  var musicToggle = document.getElementById('musicToggle');
  var musicState = document.getElementById('musicState');
  var musicToggleTop = document.getElementById('musicToggleTop');
  var musicNote = document.getElementById('musicNote');
  var musicWanted = read('rafiprx-music') === 'on';
  var musicBroken = false;

  function reflectMusic(){
    var on = musicWanted && !audio.paused;
    var checked = (musicWanted && !musicBroken) ? 'true' : 'false';
    musicToggle.setAttribute('aria-checked', checked);
    musicState.textContent = on ? 'On' : 'Off';
    if (musicToggleTop){
      musicToggleTop.setAttribute('aria-checked', checked);
      musicToggleTop.classList.toggle('muted', !(musicWanted && !musicBroken));
      musicToggleTop.setAttribute('aria-label', (musicWanted && !musicBroken) ? 'Turn music off' : 'Turn music on');
    }
    musicNote.hidden = !musicBroken;
  }
  function tryPlay(){
    if (musicBroken) { reflectMusic(); return; }
    var p = audio.play();
    if (p && p.catch) p.catch(function(){ reflectMusic(); });
    reflectMusic();
  }
  function setMusic(on){
    musicWanted = on;
    store('rafiprx-music', on ? 'on' : 'off');
    sStore('rafiprx-mwant', on ? '1' : '0');
    if (on) { tryPlay(); }
    else { audio.pause(); reflectMusic(); }
  }
  musicToggle.addEventListener('click', function(){ setMusic(!musicWanted); });
  if (musicToggleTop) musicToggleTop.addEventListener('click', function(){ setMusic(!musicWanted); });
  audio.addEventListener('error', function(){
    musicBroken = true;
    musicWanted = false;
    reflectMusic();
  }, true);
  audio.addEventListener('play', reflectMusic);
  audio.addEventListener('pause', reflectMusic);
  reflectMusic();

  /* ================= entry page + session music =================
     The Entry Page is the audio unlock: nothing plays before its button is
     clicked. Within the same tab session the gate is skipped and, if music
     was on, playback resumes from the saved position instead of restarting —
     so moving between pages of this site keeps one continuous track. A new
     tab/session always starts at the Entry Page again. If the browser still
     blocks a resume, the next tap anywhere starts it (graceful fallback). */
  var entryGate = document.getElementById('entryGate');
  var entryBtn = document.getElementById('entryBtn');
  var sessionEntered = sRead('rafiprx-entered') === '1';

  function saveMusicPos(){
    try {
      if (!audio.paused && isFinite(audio.currentTime)) sStore('rafiprx-mpos', String(Math.floor(audio.currentTime)));
    } catch (e) {}
  }
  setInterval(saveMusicPos, 1000);
  window.addEventListener('pagehide', saveMusicPos);

  function resumeSessionMusic(){
    if (sRead('rafiprx-mwant') !== '1' || musicBroken) return;
    musicWanted = true;
    var pos = parseFloat(sRead('rafiprx-mpos') || '0');
    var begin = function(){
      if (isFinite(pos) && pos > 0 && isFinite(audio.duration) && pos < audio.duration) {
        try { audio.currentTime = pos; } catch (e) {}
      }
      tryPlay();
      setTimeout(function(){
        if (musicWanted && audio.paused && !musicBroken) {
          document.addEventListener('pointerdown', function kick(){
            document.removeEventListener('pointerdown', kick);
            if (musicWanted && audio.paused) tryPlay();
          });
        }
      }, 600);
    };
    if (audio.readyState >= 1) { begin(); }
    else {
      audio.addEventListener('loadedmetadata', begin, { once: true });
      try { audio.load(); } catch (e) { begin(); }
    }
  }

  if (sessionEntered) {
    if (entryGate) entryGate.style.display = 'none';
    resumeSessionMusic();
  } else if (entryBtn) {
    try { entryBtn.focus({ preventScroll: true }); } catch (e) {}
    entryBtn.addEventListener('click', function(){
      sStore('rafiprx-entered', '1');
      document.documentElement.classList.remove('gated');
      document.documentElement.classList.add('entered');
      if (entryGate) {
        entryGate.classList.add('leaving');
        setTimeout(function(){ if (entryGate) entryGate.style.display = 'none'; }, 520);
      }
      setMusic(true); /* this click is the user gesture audio playback needs */
    });
  }

  /* ================= 3D Minecraft avatar (skinview3d) ================= */
  var canvas = document.getElementById('skinCanvas');
  var wrap = document.getElementById('skinViewer');
  var skinNote = document.getElementById('skinNote');
  var skinPh = document.getElementById('skinPlaceholder');
  var skinReady = false; /* true once a skin texture is applied; drives the loading face */

  function showFallback(){
    canvas.hidden = true;
    canvas.style.display = 'none'; /* author CSS display:block would otherwise override [hidden] */
    skinNote.hidden = false;
    if (skinPh) skinPh.style.display = 'none';
    /* the viewer is a fixed overlay: put it back in flow so the note shows */
    wrap.style.position = 'relative';
    wrap.style.transform = 'none';
    wrap.style.left = 'auto';
    wrap.style.top = 'auto';
    wrap.style.zIndex = 'auto';
    wrap.style.margin = '0 auto';
  }

  function initViewer(){
    if (!window.skinview3d) { showFallback(); return; }
    var viewer;
    try {
      viewer = new skinview3d.SkinViewer({
        canvas: canvas,
        width: wrap.clientWidth,
        height: wrap.clientHeight,
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        zoom: 0.8
      });
    } catch (e) { showFallback(); return; }

    /* Still character: no animation is loaded and auto-rotate stays off.
       Zoom and pan are disabled. Dragging the character itself moves it
       (see setupCharacter); the camera-orbit controls are switched off
       while a drag is active so the view never spins mid-drag. */
    viewer.autoRotate = false;
    if (viewer.controls) {
      viewer.controls.enablePan = false;
      viewer.controls.enableZoom = false;
      viewer.controls.autoRotate = false;
      viewer.controls.minPolarAngle = 1.0;
      viewer.controls.maxPolarAngle = 2.1;
    }
    /* touch swipes starting on the character may scroll the page; only an
       active drag switches this to 'none' (see endDrag) */
    canvas.style.touchAction = 'pan-y';

    viewer.loadSkin(SKIN_URL, { model: 'auto-detect' })
      .then(function(){ skinReady = true; if (skinPh) skinPh.style.display = 'none'; })
      .catch(function(){ return viewer.loadSkin(SKIN_FALLBACK_DATA, { model: 'auto-detect' }); })
      .then(function(){ skinReady = true; if (skinPh) skinPh.style.display = 'none'; })
      .catch(function(){ showFallback(); });

    /* ---- Character movement + head tracking ----
       The viewer is a fixed overlay displayed at 40% (CSS scale) that runs
       toward the pointer: on desktop it follows the mouse live; on touch
       screens it runs to the last tap point. Before the first pointer
       interaction it stays parked at the centre of its original spot.
       Dragging the character itself moves it (the chase is replaced by
       drag positioning while dragging). Links stay clickable: while chasing, the character stops
       ~100px short of the cursor, so the click point is never under it;
       it only closes right in when the pointer is already over it, so it
       can still be grabbed and dragged. Movement covers the whole visible
       viewport (8px margin), and the character renders above the card but
       below the top bar and panels.
       SPEED MODELS (keyed off the event's pointerType, never the UA or
       the layout, so a phone in Desktop Site mode still gets phone
       behaviour): touch = one fixed comfortable pace (gain 3.5, cap
       520px/s) no matter how fast the finger flicks; mouse/pen = the cap
       follows the measured pointer speed (min 220, max 1600px/s), so a
       slow mouse means a slow run and a fast mouse means a fast catch-up,
       with smooth acceleration and deceleration throughout.
       DRAG & HOLD (on top of chasing): pressing the character itself
       drags it — mouse/pen start dragging at once, touch arms a long-press
       (350ms, 12px tolerance) so taps and swipes never drag by accident.
       While dragging, the character glides quickly to sit directly under
       the pointer (no snap: it eases there), the camera controls switch
       off, and page scrolling is blocked only for the active drag. On
       release, chasing resumes from the existing speed system, and a
       click caused by the drag itself is swallowed once so no link
       underneath can fire by accident. */
    (function setupCharacter(){
      var spacer = document.getElementById('avatarWrap');
      var SCALE = 0.4;
      var STOP_CHASE = 100;  /* stop this far from the cursor while chasing */
      var STOP_ARRIVE = 10;  /* stop this close once the pointer is over it */
      var TOUCH_GAIN = 3.5, TOUCH_CAP = 520;   /* phones: one comfortable pace */
      var PC_GAIN = 6;                          /* PCs: gain fixed, cap follows pointer speed */
      var PC_CAP_MIN = 220, PC_CAP_MAX = 1600;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function halfSize(){
        return { hw: (wrap.clientWidth * SCALE) / 2, hh: (wrap.clientHeight * SCALE) / 2 };
      }
      function place(cx, cy){
        var h = halfSize();
        wrap.style.transform = 'translate3d(' + (cx - h.hw) + 'px,' + (cy - h.hh) + 'px,0) scale(' + SCALE + ')';
        if (skinPh && !skinReady) skinPh.style.display = 'block'; /* show loading face once positioned */
      }
      function spacerCenter(){
        var r = spacer.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
      if (reduced) {
        /* no motion at all: park the small character in its original spot */
        var c0 = spacerCenter();
        place(c0.x, c0.y);
        return;
      }
      var MAX_YAW = 0.62;    /* head turn from pointer position, radians */
      var MAX_PITCH = 0.36;  /* head tilt up/down */
      var MAX_HEAD = 0.85;   /* absolute clamp so the neck never over-turns */
      var tYaw = 0, tPitch = 0;  /* head target (screen space) */
      var cYaw = 0, cPitch = 0;  /* head smoothed current values */
      var pos = spacerCenter();
      var target = { x: pos.x, y: pos.y };
      var hasTarget = false, dragging = false, lastPointerType = 'mouse';
      var lastPX = pos.x, lastPY = pos.y;
      var pendingTouchDrag = null, grabPos = null, dragMoved = false, suppressClick = false;
      var ptrSpeed = 0, lastMoveT = 0, lastMX = 0, lastMY = 0; /* smoothed pointer speed (mouse/pen only) */
      var faceYaw = 0, runBlend = 0, runPhase = 0, lastT = 0;

      function clearPendingTouchDrag(){
        if (pendingTouchDrag) { clearTimeout(pendingTouchDrag.timer); pendingTouchDrag = null; }
      }
      function startDrag(){
        if (dragging) return;
        dragging = true;
        grabPos = { x: pos.x, y: pos.y };
        dragMoved = false;
        try { if (viewer.controls) viewer.controls.enabled = false; } catch (e) {}
        canvas.style.touchAction = 'none';
      }
      function endDrag(moved){
        clearPendingTouchDrag();
        if (!dragging) return;
        dragging = false;
        try { if (viewer.controls) viewer.controls.enabled = true; } catch (e) {}
        canvas.style.touchAction = 'pan-y';
        target = clampTarget(lastPX, lastPY); /* resume chasing from the release point */
        hasTarget = true;
        if (moved) {
          /* swallow the single click the drag's own release would otherwise dispatch */
          suppressClick = true;
          setTimeout(function(){ suppressClick = false; }, 350);
        }
      }
      /* one-shot click guard: eats only the click that ends a real drag */
      window.addEventListener('click', function(e){
        if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
      }, true);
      /* block page scrolling only while a drag is actually active */
      window.addEventListener('touchmove', function(e){
        if (dragging) e.preventDefault();
      }, { passive: false });

      /* Full visible viewport, 8px margin on every side: the character's
         box always stays fully on screen, and its centre can reach every
         corner and edge. Bounds come from the actual viewport size read
         fresh on every call — never from the card, the links, or any fixed
         height — so tall viewports (e.g. a phone in Desktop Site mode,
         where the layout viewport is much taller than the card) get their
         whole bottom half too. The min/max guards keep a valid range on
         viewports narrower or shorter than the character itself. */
      function clampTarget(tx, ty){
        var h = halfSize();
        var vw = window.innerWidth, vh = window.innerHeight;
        var left = Math.min(h.hw + 8, vw / 2), right = Math.max(vw - h.hw - 8, vw / 2);
        var top = Math.min(h.hh + 8, vh / 2), bottom = Math.max(vh - h.hh - 8, vh / 2);
        return { x: Math.max(left, Math.min(right, tx)), y: Math.max(top, Math.min(bottom, ty)) };
      }
      function setHeadTarget(clientX, clientY){
        var r = canvas.getBoundingClientRect();
        if (!r.width || !window.innerWidth) return;
        var hx = r.left + r.width / 2;
        var hy = r.top + r.height * 0.25; /* approx. head position on screen */
        /* normalise against the distance to each screen edge, so the head
           reaches its full turn exactly at the edges in every direction */
        var nx = clientX < hx ? (clientX - hx) / Math.max(hx, 1)
                              : (clientX - hx) / Math.max(window.innerWidth - hx, 1);
        var ny = clientY < hy ? (clientY - hy) / Math.max(hy, 1)
                              : (clientY - hy) / Math.max(window.innerHeight - hy, 1);
        nx = Math.max(-1, Math.min(1, nx));
        ny = Math.max(-1, Math.min(1, ny));
        tYaw = nx * MAX_YAW;
        tPitch = ny * MAX_PITCH;
      }
      window.addEventListener('pointermove', function(e){
        setHeadTarget(e.clientX, e.clientY);
        if (e.pointerType === 'touch') {
          if (dragging) { lastPX = e.clientX; lastPY = e.clientY; return; }
          /* a swipe before the long-press fires cancels the pending drag */
          if (pendingTouchDrag &&
              (Math.abs(e.clientX - pendingTouchDrag.x) > 12 || Math.abs(e.clientY - pendingTouchDrag.y) > 12)) clearPendingTouchDrag();
          return; /* touch: taps move it, scrolls must not */
        }
        /* mouse released outside the window: a move with no button held ends the drag */
        if (dragging && e.buttons === 0) { endDrag(dragMoved); return; }
        lastPointerType = e.pointerType || 'mouse';
        lastPX = e.clientX; lastPY = e.clientY;
        target = clampTarget(e.clientX, e.clientY);
        hasTarget = true;
        /* measure pointer speed (smoothed) for the PC dynamic cap */
        var nowMs = performance.now();
        if (lastMoveT) {
          var mdt = (nowMs - lastMoveT) / 1000;
          if (mdt > 0.01) {
            var inst = Math.sqrt((e.clientX - lastMX) * (e.clientX - lastMX) + (e.clientY - lastMY) * (e.clientY - lastMY)) / mdt;
            ptrSpeed = ptrSpeed * 0.7 + Math.min(inst, 4000) * 0.3;
          }
        }
        lastMX = e.clientX; lastMY = e.clientY; lastMoveT = nowMs;
      }, { passive: true });
      window.addEventListener('pointerdown', function(e){
        setHeadTarget(e.clientX, e.clientY);
        lastPointerType = e.pointerType || 'mouse';
        lastPX = e.clientX; lastPY = e.clientY;
        target = clampTarget(e.clientX, e.clientY);
        hasTarget = true;
      }, { passive: true });
      canvas.addEventListener('pointerdown', function(e){
        if (e.pointerType === 'touch') {
          /* arm a long-press: only a still hold becomes a drag; a swipe or tap cancels it */
          clearPendingTouchDrag();
          var sx = e.clientX, sy = e.clientY;
          pendingTouchDrag = { x: sx, y: sy, timer: setTimeout(function(){
            pendingTouchDrag = null;
            startDrag();
          }, 350) };
        } else if (e.button === 0 || e.button === undefined) {
          startDrag();
        }
      }, { passive: true });
      window.addEventListener('pointerup', function(){
        if (dragging) endDrag(dragMoved);
        else clearPendingTouchDrag();
      }, { passive: true });
      window.addEventListener('pointercancel', function(){
        clearPendingTouchDrag();
        if (dragging) endDrag(false);
      }, { passive: true });

      (function tick(now){
        requestAnimationFrame(tick);
        if (document.hidden || canvas.hidden) return;
        if (!lastT) lastT = now || performance.now();
        var t = now || performance.now();
        var dt = Math.min((t - lastT) / 1000, 0.05);
        lastT = t;
        var speed = 0;
        /* pointer stopped: let the PC speed cap decay back to its minimum */
        if (lastMoveT && t - lastMoveT > 150) ptrSpeed *= Math.exp(-3 * dt);

        if (!hasTarget) {
          /* parked on the original spot until the first pointer interaction */
          var sc = spacerCenter();
          pos.x = sc.x; pos.y = sc.y;
          place(pos.x, pos.y);
        } else if (dragging) {
          /* dragged: glide quickly to sit directly under the pointer (no snap, no stop radius) */
          var dc = clampTarget(lastPX, lastPY);
          var ddx = dc.x - pos.x, ddy = dc.y - pos.y;
          var ddist = Math.sqrt(ddx * ddx + ddy * ddy);
          if (ddist > 0.5) {
            var dk = 1 - Math.exp(-14 * dt);
            var nnx = pos.x + ddx * dk, nny = pos.y + ddy * dk;
            speed = Math.sqrt((nnx - pos.x) * (nnx - pos.x) + (nny - pos.y) * (nny - pos.y)) / Math.max(dt, 0.001);
            pos.x = nnx; pos.y = nny;
            if (grabPos && Math.sqrt((pos.x - grabPos.x) * (pos.x - grabPos.x) + (pos.y - grabPos.y) * (pos.y - grabPos.y)) > 12) dragMoved = true;
            if (speed > 40 && Math.abs(ddx) > 20) {
              var dwant = ddx > 0 ? Math.PI / 2 : -Math.PI / 2;
              var ddiff = Math.atan2(Math.sin(dwant - faceYaw), Math.cos(dwant - faceYaw));
              faceYaw += ddiff * (1 - Math.exp(-10 * dt));
            }
          }
          place(pos.x, pos.y);
        } else {
          var pc = clampTarget(pos.x, pos.y);
          pos.x = pc.x; pos.y = pc.y;
          var h = halfSize();
          var over = lastPointerType !== 'touch' &&
            Math.abs(lastPX - pos.x) <= h.hw + 4 && Math.abs(lastPY - pos.y) <= h.hh + 4;
          var isTouch = lastPointerType === 'touch';
          var stopR = (over || isTouch) ? STOP_ARRIVE : STOP_CHASE;
          var dx = target.x - pos.x, dy = target.y - pos.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > stopR) {
            var gain = isTouch ? TOUCH_GAIN : PC_GAIN;
            var cap = isTouch ? TOUCH_CAP : Math.max(PC_CAP_MIN, Math.min(PC_CAP_MAX, PC_CAP_MIN + ptrSpeed * 0.9));
            var vx = dx * gain, vy = dy * gain;
            var vm = Math.sqrt(vx * vx + vy * vy);
            if (vm > cap) { vx = vx / vm * cap; vy = vy / vm * cap; }
            var nx = pos.x + vx * dt, ny = pos.y + vy * dt;
            var ndx = target.x - nx, ndy = target.y - ny;
            var ndist = Math.sqrt(ndx * ndx + ndy * ndy);
            if (ndist < stopR && ndist > 0) { nx = target.x - ndx / ndist * stopR; ny = target.y - ndy / ndist * stopR; }
            speed = Math.sqrt((nx - pos.x) * (nx - pos.x) + (ny - pos.y) * (ny - pos.y)) / Math.max(dt, 0.001);
            pos.x = nx; pos.y = ny;
            /* face travel direction (side view, never backwards) */
            if (speed > 40 && Math.abs(dx) > 20) {
              var want = dx > 0 ? Math.PI / 2 : -Math.PI / 2;
              var diff = Math.atan2(Math.sin(want - faceYaw), Math.cos(want - faceYaw));
              faceYaw += diff * (1 - Math.exp(-10 * dt));
            }
          }
          place(pos.x, pos.y);
        }
        /* run/idle blend (attack fast, release slower, so no pops) */
        var wantBlend = speed > 40 ? 1 : 0;
        runBlend += (wantBlend - runBlend) * (1 - Math.exp(-(wantBlend ? 8 : 4) * dt));
        if (runBlend > 0.01) runPhase += dt * 13;
        /* idle: ease back to the subtle turn toward the pointer */
        if (speed <= 40) {
          var diff0 = Math.atan2(Math.sin(cYaw * 0.18 - faceYaw), Math.cos(cYaw * 0.18 - faceYaw));
          faceYaw += diff0 * (1 - Math.exp(-5 * dt));
        }

        /* head smoothing (unchanged behaviour) */
        cYaw += (tYaw - cYaw) * 0.10;
        cPitch += (tPitch - cPitch) * 0.10;
        var player = viewer.playerObject;
        var head = player && player.skin && player.skin.head;
        if (!player || !head) return;
        player.rotation.y = faceYaw;
        /* running pose: Minecraft limb-swing cycle, amplitude follows runBlend */
        var skin = player.skin;
        if (skin) {
          var b = runBlend, ph = runPhase;
          var lc = Math.cos(ph);
          if (skin.leftLeg) skin.leftLeg.rotation.x = -1.3 * b * lc;
          if (skin.rightLeg) skin.rightLeg.rotation.x = 1.3 * b * lc;
          if (skin.leftArm) { skin.leftArm.rotation.x = 1.5 * b * lc; skin.leftArm.rotation.z = b * (0.1 * lc + 0.1 * Math.PI); }
          if (skin.rightArm) { skin.rightArm.rotation.x = -1.5 * b * lc; skin.rightArm.rotation.z = b * (-0.1 * lc - 0.1 * Math.PI); }
          player.position.y = b * Math.cos(2 * ph);
          player.position.x = b * 0.15 * lc;
          player.rotation.z = b * 0.01 * Math.cos(ph + Math.PI);
        }
        var az = 0;
        try { if (viewer.controls && viewer.controls.getAzimuthalAngle) az = viewer.controls.getAzimuthalAngle(); } catch (e) {}
        var yaw = cYaw + az - player.rotation.y;
        while (yaw > Math.PI) yaw -= Math.PI * 2;
        while (yaw < -Math.PI) yaw += Math.PI * 2;
        head.rotation.y = Math.max(-MAX_HEAD, Math.min(MAX_HEAD, yaw));
        head.rotation.x = cPitch;
      })(performance.now());
    })();

    function fit(){
      if (wrap.clientWidth > 0) { viewer.width = wrap.clientWidth; viewer.height = wrap.clientHeight; }
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);

    /* save power: pause rendering while the tab is hidden */
    document.addEventListener('visibilitychange', function(){
      try { viewer.renderPaused = document.hidden; } catch (e) {}
    });
  }
  function startViewer(){
    if (window.skinview3d) { initViewer(); return; }
    /* primary CDN failed: try the mirror once, then show the fallback note */
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/skinview3d@3.4.1/bundles/skinview3d.bundle.js';
    s.onload = initViewer;
    s.onerror = showFallback;
    document.head.appendChild(s);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startViewer);
  } else { startViewer(); }
})();
</script>
</body>
</html>
