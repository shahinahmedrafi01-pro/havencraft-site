<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>
<meta name="description" content="Life is short focus on what truly matters, grow daily, and leave a positive impact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f7;
    --ink:#2d4a4e;
    --coral:#ff6f61;
    --coral-dark:#f4574c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    position:relative;
    overflow-x:hidden;
  }
  /* decorative blush squares */
  .deco{position:fixed;border-radius:6px;pointer-events:none;z-index:0}
  .deco.d1{width:90px;height:90px;top:8%;left:6%;background:#f6c9c4;opacity:.28;transform:rotate(12deg)}
  .deco.d2{width:56px;height:56px;top:70%;left:10%;background:#f9d9c9;opacity:.32;transform:rotate(-8deg)}
  .deco.d3{width:120px;height:120px;top:14%;right:8%;background:#f6c9c4;opacity:.22;transform:rotate(-14deg)}
  .deco.d4{width:64px;height:64px;bottom:10%;right:12%;background:#f9d9c9;opacity:.3;transform:rotate(20deg)}
  .deco.d5{width:40px;height:40px;top:44%;left:3%;background:#f6c9c4;opacity:.25;transform:rotate(30deg)}
  .deco.d6{width:44px;height:44px;top:52%;right:4%;background:#f9d9c9;opacity:.25;transform:rotate(-24deg)}

  .card{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}

  .hero{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:30px;text-align:left}
  .hero h1{font-size:clamp(1.35rem,4.6vw,1.9rem);font-weight:800;line-height:1.35;letter-spacing:-.01em;flex:1}
  .avatar{width:118px;height:118px;flex:0 0 118px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 6px 22px rgba(45,74,78,.14)}

  .icon-row{display:flex;justify-content:center;gap:18px;margin-bottom:30px}
  .icon-btn{width:58px;height:58px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,111,97,.38);transition:transform .15s ease,background .15s ease}
  .icon-btn:hover{transform:translateY(-3px);background:var(--coral-dark)}
  .icon-btn svg{width:26px;height:26px;fill:#fff}

  .pill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
  .pill{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:999px;padding:13px 20px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.98rem;box-shadow:0 4px 14px rgba(45,74,78,.09);transition:transform .15s ease,box-shadow .15s ease}
  .pill:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(45,74,78,.14)}
  .pill svg{width:24px;height:24px;fill:var(--coral);flex:0 0 24px}
  .pill-row2{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

  @media (max-width:480px){
    .hero{flex-direction:column-reverse;text-align:center;gap:16px}
    .pill-grid{grid-template-columns:1fr 1fr}
    .pill-grid .pill:last-child{grid-column:1/-1}
    .pill-row2{grid-template-columns:1fr 1fr;grid-column:1/-1}
  }
</style>
</head>
