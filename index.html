<head>

<title>About Me</title>
<meta name="description" content="Life is short focus on what truly matters, grow daily, and leave a positive impact.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ee;
    --ink:#2d4a4e;
    --coral:#ff6f61;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  /* decorative blush squares — slowly drifting, like the original */
  .deco{position:fixed;border-radius:8px;pointer-events:none;z-index:0;animation:drift 16s ease-in-out infinite alternate}
  .deco.d1{width:92px;height:92px;top:7%;left:6%;background:#f6c9c4;opacity:.30;--r:12deg}
  .deco.d2{width:58px;height:58px;top:66%;left:9%;background:#f9d9c9;opacity:.34;--r:-8deg;animation-duration:19s}
  .deco.d3{width:124px;height:124px;top:12%;right:7%;background:#f6c9c4;opacity:.24;--r:-14deg;animation-duration:22s}
  .deco.d4{width:66px;height:66px;bottom:9%;right:11%;background:#f9d9c9;opacity:.32;--r:20deg;animation-duration:17s}
  .deco.d5{width:42px;height:42px;top:44%;left:3%;background:#f6c9c4;opacity:.26;--r:30deg;animation-duration:14s}
  .deco.d6{width:46px;height:46px;top:52%;right:4%;background:#f9d9c9;opacity:.26;--r:-24deg;animation-duration:20s}
  @keyframes drift{
    from{transform:rotate(var(--r,0deg)) translate(0,0)}
    to{transform:rotate(calc(var(--r,0deg) + 7deg)) translate(14px,-18px)}
  }

  .card{position:relative;z-index:1;width:100%;max-width:620px;margin:0 auto;text-align:center;padding:clamp(42px,9vh,84px) 22px 72px}

  .avatar-wrap{position:relative;display:inline-block}
  .avatar-wrap::before{content:'';position:absolute;width:118px;height:118px;right:-56px;top:36px;background:#f9dcd6;border-radius:8px;transform:rotate(4deg);z-index:-1;animation:drift 18s ease-in-out infinite alternate;--r:4deg}
  .avatar{height:178px;width:auto;display:block;margin:0 auto}

  h1{font-size:clamp(1.65rem,5.2vw,2.35rem);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:30px 0 32px}

  .icon-row{display:flex;justify-content:center;gap:20px}
  .icon-btn{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#ff8168,#ff5f57);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(255,111,97,.35);transition:transform .18s ease}
  .icon-btn:hover{transform:translateY(-3px) scale(1.05)}
  .icon-btn svg{width:27px;height:27px;fill:#fff}
  .icon-btn svg[fill="none"]{fill:none}

  .pills{display:flex;flex-direction:column;gap:14px;margin-top:38px}
  .pill{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:999px;padding:15px 22px;text-decoration:none;color:var(--ink);font-weight:600;font-size:1.05rem;box-shadow:0 4px 14px rgba(45,74,78,.09);transition:transform .18s ease,box-shadow .18s ease}
  .pill:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(45,74,78,.14)}
  .pill svg{width:26px;height:26px;fill:var(--coral);flex:0 0 26px}

  /* scroll reveal */
  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
  .rv.in{opacity:1;transform:none}
  .pills .pill:nth-child(2){transition-delay:.05s}
  .pills .pill:nth-child(3){transition-delay:.1s}
  .pills .pill:nth-child(4){transition-delay:.15s}
  .pills .pill:nth-child(5){transition-delay:.2s}

  @media (max-width:480px){
    .avatar{height:152px}
    .avatar-wrap::before{width:96px;height:96px;right:-40px;top:30px}
    h1{margin:24px 0 26px}
    .icon-btn{width:56px;height:56px}
  }
  @media (prefers-reduced-motion: reduce){
    .deco,.avatar-wrap::before{animation:none}
    .rv{opacity:1;transform:none;transition:none}
  }
</style>
</head>
