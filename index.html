<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>
<meta name="description" content="Life is short focus on what truly matters, grow daily, and leave a positive impact.">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="theme-color" content="#0a0a10">
<script>
/* Apply saved theme before first paint (default: dark) */
(function(){try{var t=localStorage.getItem('rafiprx-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<script>
/* Entry gate state before first paint: visitors who already entered in this
   tab session skip the Entry Page; everyone else sees it first. */
(function(){try{if(sessionStorage.getItem('rafiprx-entered')==='1'){document.documentElement.classList.add('entered');}else{document.documentElement.classList.add('gated');}}catch(e){document.documentElement.classList.add('gated');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a0a10;
    --bg2:#14101f;
    --ink:#f5f3fb;
    --muted:#a49ec0;
    --accent:#a855f7;
    --accent2:#c084fc;
    --glass:rgba(26,22,46,.34);
    --glass-brd:rgba(168,85,247,.32);
    --glass-hi:rgba(40,34,72,.50);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --glow1:rgba(147,51,234,.22);
    --glow2:rgba(147,51,234,.12);
    --cube-brd:rgba(168,85,247,.28);
    --cube-bg:linear-gradient(145deg,rgba(168,85,247,.16),rgba(168,85,247,.03));
    --focus:#d8b4fe;
    --bgwash:linear-gradient(180deg, rgba(7,4,16,.50), rgba(7,4,16,.64));
    --glassbox:rgba(24,16,46,.16);
    --glassbox-hi:rgba(40,28,72,.30);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#faf6ee;
    --bg2:#f1e9da;
    --ink:#2c2140;
    --muted:#6f6484;
    --accent:#9333ea;
    --accent2:#a855f7;
    --glass:rgba(255,255,255,.45);
    --glass-brd:rgba(147,51,234,.30);
    --glass-hi:rgba(255,255,255,.62);
    --shadow:0 10px 26px rgba(76,50,120,.15);
    --glow1:rgba(147,51,234,.14);
    --glow2:rgba(147,51,234,.07);
    --cube-brd:rgba(147,51,234,.25);
    --cube-bg:linear-gradient(145deg,rgba(147,51,234,.12),rgba(147,51,234,.03));
    --focus:#7e22ce;
    --bgwash:linear-gradient(180deg, rgba(250,246,238,.87), rgba(250,246,238,.91));
    --glassbox:rgba(255,255,255,.22);
    --glassbox-hi:rgba(255,255,255,.40);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(640px 420px at 88% -6%, var(--glow1), transparent 62%),
      radial-gradient(760px 540px at -12% 104%, var(--glow2), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    transition:background .35s ease, color .35s ease;
  }

  /* ---------- scenic background (the owner's two artworks) ----------
     Phones — including phone desktop mode — get the portrait scene;
     large PC screens get the wide scene. cover-fit only: the artwork is
     never stretched or distorted. A theme wash above it keeps the glass
     UI readable in both dark and light themes. */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url('./bg-mobile.webp') center 30%/cover no-repeat;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--bgwash);
  }
  @media (orientation:landscape) and (max-width:1099px){
    body::before{background-position:center 32%}
  }
  /* large screens get the wide scene: real PCs match pointer:fine; the
     aspect-ratio arm covers pointer-less environments. Phones in desktop
     mode report a <1100px viewport, so they keep the portrait scene. */
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    body::before{background-image:url('./bg-desktop.webp');background-position:center}
  }

  /* decorative glass cubes — light, mostly static */
  .bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .cube{position:absolute;border-radius:16px;background:var(--cube-bg);border:1px solid var(--cube-brd);box-shadow:var(--shadow);opacity:.5}
  .cube::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 45%)}
  .cube.c1{width:110px;height:110px;top:9%;left:5%;transform:rotate(14deg)}
  .cube.c2{width:64px;height:64px;top:63%;left:8%;transform:rotate(-10deg)}
  .cube.c3{width:140px;height:140px;top:14%;right:6%;transform:rotate(-16deg)}
  .cube.c4{width:74px;height:74px;bottom:8%;right:10%;transform:rotate(22deg)}
  .cube.c5{width:44px;height:44px;top:46%;left:2.5%;transform:rotate(28deg)}
  @keyframes drift{from{margin-top:0}to{margin-top:14px}}
  .cube.c1,.cube.c3{animation:drift 13s ease-in-out infinite alternate}

  .card{position:relative;z-index:1;width:100%;max-width:620px;margin:0 auto;text-align:center;padding:clamp(40px,8vh,76px) 22px 72px}

  /* ---------- 3D avatar ---------- */
  .avatar-wrap{position:relative}
  .skin-viewer{width:min(74vw,290px);height:372px;margin:0 auto;position:relative}
  .skin-viewer canvas{width:100%;height:100%;display:block;cursor:grab;border-radius:18px}
  .skin-viewer canvas:active{cursor:grabbing}
  .skin-note{color:var(--muted);font-size:.9rem;padding:24px 10px}

  h1{font-size:clamp(1.35rem,4.6vw,1.9rem);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:26px 0 30px}

  /* ---------- glass contact shortcuts ---------- */
  .icon-row{display:flex;justify-content:center;gap:20px}
  .icon-btn{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--accent2);background:var(--glassbox);backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);border-radius:14px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45)) drop-shadow(0 0 8px rgba(147,51,234,.25));transition:transform .18s ease,background .18s ease}
  .icon-btn::before{content:"";position:absolute;inset:0;padding:1.5px;background:linear-gradient(135deg,rgba(192,132,252,.95),rgba(147,51,234,.55) 55%,rgba(192,132,252,.95));border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
  .icon-btn:hover{transform:translateY(-3px) scale(1.05);background:var(--glassbox-hi)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{position:relative;z-index:1;width:23px;height:23px;fill:currentColor}
  .icon-btn svg[fill="none"]{fill:none}

  /* ---------- glass social pills ---------- */
  .pills{display:flex;flex-direction:column;gap:14px;margin-top:38px}
  .pill{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;text-decoration:none;color:var(--ink);font-weight:600;font-size:1.05rem;background:var(--glassbox);backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);border-radius:16px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(147,51,234,.25));transition:transform .18s ease,background .18s ease}
  .pill::before{content:"";position:absolute;inset:0;padding:1.5px;background:linear-gradient(120deg,rgba(192,132,252,.95),rgba(147,51,234,.55) 50%,rgba(192,132,252,.95));border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
  .pill>*{position:relative;z-index:1}
  .pill:hover{transform:translateY(-2px);background:var(--glassbox-hi)}
  .pill:active{transform:scale(.985)}
  .pill svg{width:26px;height:26px;fill:var(--accent2);flex:0 0 26px}

  a:focus-visible, button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

  /* ---------- three-dot settings ---------- */
  .menu-wrap{position:fixed;top:14px;left:14px;z-index:60}
  .menu-btn{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s ease,transform .18s ease}
  .menu-btn:hover{background:var(--glass-hi)}
  .menu-btn:active{transform:scale(.94)}
  .menu-btn svg{width:20px;height:20px;fill:currentColor}
  .settings{position:absolute;top:54px;left:0;width:min(238px,82vw);background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left}
  .settings[hidden]{display:none}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
  .set-label{font-weight:600;font-size:.95rem}
  .set-note{font-size:.78rem;color:var(--muted);padding:4px 2px 0}
  .set-sep{height:1px;background:var(--glass-brd);margin:10px 0;opacity:.6}
  .switch{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--glass-brd);border-radius:999px;padding:5px 10px 5px 5px;cursor:pointer;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600}
  .switch .track{width:34px;height:19px;border-radius:999px;background:rgba(140,130,170,.35);position:relative;transition:background .2s ease;flex:0 0 34px}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .switch[aria-checked="true"] .track{background:var(--accent)}
  .switch[aria-checked="true"] .track::after{left:17px}
  .theme-opts{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:8px}
  .theme-opt{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:1px solid var(--glass-brd);border-radius:12px;padding:9px 12px;color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .18s ease}
  .theme-opt:hover{background:var(--glass-hi)}
  .theme-opt .check{color:var(--accent2);font-weight:800;visibility:hidden}
  .theme-opt[aria-checked="true"] .check{visibility:visible}
  .theme-opt[aria-checked="true"]{border-color:var(--accent)}

  /* scroll reveal (kept from the original page) */
  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
  .rv.in{opacity:1;transform:none}
  .pills .pill:nth-child(2){transition-delay:.05s}
  .pills .pill:nth-child(3){transition-delay:.1s}
  .pills .pill:nth-child(4){transition-delay:.15s}
  .pills .pill:nth-child(5){transition-delay:.2s}

  @media (max-width:480px){
    .skin-viewer{height:336px}
    h1{margin:22px 0 26px}
    .icon-btn{width:48px;height:48px}
  }
  @media (prefers-reduced-motion: reduce){
    .cube{animation:none}
    .rv{opacity:1;transform:none;transition:none}
    html{scroll-behavior:auto}
  }

  /* ================= Entry Page (mobile-first) =================
     A framed cinematic panel floating with margins on a near-black field —
     the artwork lives inside the frame, never edge-to-edge. Shown once per
     tab session; BEGIN THE JOURNEY closes it and starts the site music. */
  html.gated body{overflow:hidden}
  .entry{display:none}
  html.gated .entry{
    display:flex;align-items:center;justify-content:center;
    position:fixed;inset:0;z-index:200;
    padding:0;
    background:#040409;
    opacity:1;transition:opacity .5s ease;
  }
  .entry.leaving{opacity:0;pointer-events:none}
  .entry-frame{
    position:relative;width:100%;height:100%;
    border-radius:0;overflow:hidden;isolation:isolate;
    border:none;
    background:linear-gradient(165deg,#0d0718 0%,#050409 52%,#0a0514 100%);
    box-shadow:inset 0 0 120px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
  }
  /* --- original artwork: layered gradients + geometry, drawn in CSS --- */
  .entry-art{position:absolute;inset:0;z-index:0;overflow:hidden}
  /* the portrait scene fills the frame; a contrast wash keeps the quote
     and button perfectly readable over it */
  .entry-art::before{
    content:"";position:absolute;inset:0;
    background:url('./bg-mobile.webp') center 24%/cover no-repeat;
  }
  .entry-art::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(5,3,12,.14) 0%, rgba(5,3,12,.34) 40%, rgba(5,3,12,.55) 60%, rgba(5,3,12,.34) 100%);
  }
  /* on large PC screens the entry uses the wide scene, same as the page */
  @media (min-width:1100px) and (pointer:fine), (min-width:1100px) and (min-aspect-ratio:13/10){
    .entry-art::before{background-image:url('./bg-desktop.webp');background-position:center}
  }
  .entry-art .nebula{
    position:absolute;left:-32%;top:9%;width:165%;height:36%;
    transform:rotate(-31deg);opacity:.45;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(217,180,255,.34) 0%, rgba(168,85,247,.34) 34%, rgba(109,40,217,.16) 58%, transparent 74%);
    filter:blur(14px);
  }
  .entry-art .nebula.core{
    top:16.5%;height:13%;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(240,220,255,.5) 0%, rgba(192,132,252,.38) 42%, transparent 72%);
    filter:blur(7px);
  }
  .entry-art .nebula.low{
    top:auto;bottom:-4%;left:-20%;height:26%;opacity:.55;
    transform:rotate(-24deg);
  }
  .entry-art .dust{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 22% 30%, rgba(233,213,255,.75) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 71% 18%, rgba(233,213,255,.55) 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 84% 57%, rgba(216,180,254,.6) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 14% 68%, rgba(216,180,254,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 57% 84%, rgba(233,213,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 12%, rgba(233,213,255,.5) 50%, transparent 51%);
  }
  .entry-art .geo{position:absolute;border:1px solid rgba(192,132,252,.30)}
  .entry-art .geo.sq1{width:118px;height:118px;top:11%;right:-34px;transform:rotate(24deg)}
  .entry-art .geo.sq2{width:64px;height:64px;bottom:15%;left:-20px;transform:rotate(-14deg);border-color:rgba(192,132,252,.22)}
  .entry-art .geo.ring{width:150px;height:150px;border-radius:50%;bottom:-52px;right:-38px;border-color:rgba(192,132,252,.16)}
  .entry-art .geo.line{width:150%;height:0;border:none;border-top:1px solid rgba(192,132,252,.13);top:64%;left:-25%;transform:rotate(-31deg)}
  .entry-art .geo.dia{width:9px;height:9px;top:26%;left:16%;transform:rotate(45deg);background:rgba(192,132,252,.55);border:none;box-shadow:0 0 10px rgba(168,85,247,.8)}
  .entry-art .geo.dia.d2{top:auto;left:auto;bottom:24%;right:15%;width:7px;height:7px;opacity:.8}
  /* --- content --- */
  .entry-inner{position:relative;z-index:1;text-align:center;padding:34px 30px;max-width:340px}
  .entry-quote{
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    font-weight:500;font-size:clamp(1.78rem,7.4vw,2.25rem);line-height:1.38;
    letter-spacing:.015em;color:#f1eafd;text-wrap:balance;
    text-shadow:0 2px 26px rgba(147,51,234,.4);
    animation:entryRise .9s ease both .1s;
  }
  .entry-rule{
    width:44px;height:1px;margin:26px auto 30px;
    background:linear-gradient(90deg,transparent,rgba(216,180,254,.9),transparent);
    box-shadow:0 0 8px rgba(168,85,247,.7);
    animation:entryRise .9s ease both .25s;
  }
  .entry-btn-wrap{display:inline-block;filter:drop-shadow(0 0 16px rgba(147,51,234,.45));animation:entryRise .9s ease both .4s}
  .entry-btn{
    position:relative;display:inline-block;cursor:pointer;
    font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:.82rem;
    letter-spacing:.30em;text-indent:.30em;text-transform:uppercase;color:#ecd9ff;
    padding:17px 30px;border:none;
    background:var(--glassbox);
    backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);
    border-radius:16px;
    transition:filter .2s ease,background .2s ease;
  }
  .entry-btn::before{
    content:"";position:absolute;inset:0;padding:1.5px;
    background:linear-gradient(120deg,#a855f7,#7e22ce 55%,#a855f7);
    border-radius:inherit;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    pointer-events:none;
  }
  .entry-btn span{position:relative;z-index:1}
  .entry-btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(192,132,252,.9),0 0 24px rgba(168,85,247,.45)}
  .entry-btn:hover,.entry-btn:active{background:var(--glassbox-hi)}
  .entry-btn:active{filter:brightness(1.25)}
  @keyframes entryRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes nebulaDrift{from{margin-left:0}to{margin-left:-14px}}
  .entry-art .nebula{animation:nebulaDrift 11s ease-in-out infinite alternate}
  @media (max-height:560px){
    .entry-frame{height:100%}
    .entry-quote{font-size:1.55rem}
    .entry-inner{padding:22px 24px}
  }
  @media (prefers-reduced-motion: reduce){
    .entry-quote,.entry-rule,.entry-btn-wrap{animation:none}
    .entry-art .nebula{animation:none}
  }
</style>
</head>
<body>
  <!-- Entry Page: shown once per tab session. BEGIN THE JOURNEY closes it
       and starts the background music from that click. -->
  <div id="entryGate" class="entry" role="dialog" aria-modal="true" aria-labelledby="entryQuote">
    <div class="entry-frame">
      <div class="entry-art" aria-hidden="true">
        <div class="nebula"></div>
        <div class="nebula core"></div>
        <div class="nebula low"></div>
        <div class="dust"></div>
        <div class="geo sq1"></div>
        <div class="geo sq2"></div>
        <div class="geo ring"></div>
        <div class="geo line"></div>
        <div class="geo dia"></div>
        <div class="geo dia d2"></div>
      </div>
      <div class="entry-inner">
        <p class="entry-quote" id="entryQuote">&ldquo;Not everyone knows the story behind the silence.&rdquo;</p>
        <div class="entry-rule" aria-hidden="true"></div>
        <span class="entry-btn-wrap"><button id="entryBtn" class="entry-btn" type="button"><span>BEGIN THE JOURNEY</span></button></span>
      </div>
    </div>
  </div>

  <div class="bg" aria-hidden="true"><div class="cube c1"></div><div class="cube c2"></div><div class="cube c3"></div><div class="cube c4"></div><div class="cube c5"></div></div>

  <!-- Settings menu (button at top-left) -->
  <div class="menu-wrap">
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div id="settingsMenu" class="settings" role="menu" aria-label="Settings" hidden>
      <div class="set-row">
        <span class="set-label" id="musicLabel">Music</span>
        <button id="musicToggle" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="musicLabel">
          <span class="track" aria-hidden="true"></span><span id="musicState">Off</span>
        </button>
      </div>
      <p id="musicNote" class="set-note" hidden>Music unavailable right now.</p>
      <p class="set-note">Track: Love Story</p>
      <div class="set-sep" aria-hidden="true"></div>
      <div class="set-row" style="flex-direction:column;align-items:stretch">
        <span class="set-label">Theme</span>
        <div class="theme-opts">
          <button class="theme-opt" type="button" role="menuitemradio" aria-checked="true" data-set-theme="dark">Dark Theme <span class="check" aria-hidden="true">&#10003;</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" aria-checked="false" data-set-theme="light">Light Theme <span class="check" aria-hidden="true">&#10003;</span></button>
        </div>
      </div>
    </div>
  </div>

  <main class="card">
    <div class="avatar-wrap rv">
      <div class="skin-viewer" id="skinViewer">
        <canvas id="skinCanvas" role="img" aria-label="Interactive 3D Minecraft avatar for alxxq. The character looks toward your cursor or tap. Drag to rotate the character."></canvas>

      var MAX_YAW = 0.62;    /* head turn from pointer position, radians */
      var MAX_PITCH = 0.36;  /* head tilt up/down */
      var MAX_HEAD = 0.85;   /* absolute clamp so the neck never over-turns */
      var tYaw = 0, tPitch = 0;  /* target (screen space) */
      var cYaw = 0, cPitch = 0;  /* smoothed current values */
      function setTarget(clientX, clientY){
        var r = canvas.getBoundingClientRect();
        if (!r.width || !window.innerWidth) return;
        var hx = r.left + r.width / 2;
        var hy = r.top + r.height * 0.25; /* approx. head position on screen */
        /* normalise against the distance to each screen edge, so the head
           reaches its full turn exactly at the edges in every direction */
        var nx = clientX < hx ? (clientX - hx) / Math.max(hx, 1)
                              : (clientX - hx) / Math.max(window.innerWidth - hx, 1);
        var ny = clientY < hy ? (clientY - hy) / Math.max(hy, 1)
                              : (clientY - hy) / Math.max(window.innerHeight - hy, 1);
        nx = Math.max(-1, Math.min(1, nx));
        ny = Math.max(-1, Math.min(1, ny));
        tYaw = nx * MAX_YAW;
        tPitch = ny * MAX_PITCH;
      }
      window.addEventListener('pointermove', function(e){ setTarget(e.clientX, e.clientY); }, { passive: true });
      window.addEventListener('pointerdown', function(e){ setTarget(e.clientX, e.clientY); }, { passive: true });
      (function tick(){
        requestAnimationFrame(tick);
        if (document.hidden) return;
        cYaw += (tYaw - cYaw) * 0.10;
        cPitch += (tPitch - cPitch) * 0.10;
        var player = viewer.playerObject;
        var head = player && player.skin && player.skin.head;
        if (!player || !head) return;
        /* a hint of body turn toward the pointer, like the inventory model */
        player.rotation.y = cYaw * 0.18;
        var az = 0;
        try { if (viewer.controls && viewer.controls.getAzimuthalAngle) az = viewer.controls.getAzimuthalAngle(); } catch (e) {}
        var yaw = cYaw + az - player.rotation.y;
        while (yaw > Math.PI) yaw -= Math.PI * 2;
        while (yaw < -Math.PI) yaw += Math.PI * 2;
        head.rotation.y = Math.max(-MAX_HEAD, Math.min(MAX_HEAD, yaw));
        head.rotation.x = cPitch;
      })();
    })();

    function fit(){
      if (wrap.clientWidth > 0) { viewer.width = wrap.clientWidth; viewer.height = wrap.clientHeight; }
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);

    /* save power: pause rendering while the tab is hidden */
    document.addEventListener('visibilitychange', function(){
      try { viewer.renderPaused = document.hidden; } catch (e) {}
    });
  }
  function startViewer(){
    if (window.skinview3d) { initViewer(); return; }
    /* primary CDN failed: try the mirror once, then show the fallback note */
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/skinview3d@3.4.1/bundles/skinview3d.bundle.js';
    s.onload = initViewer;
    s.onerror = showFallback;
    document.head.appendChild(s);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startViewer);
  } else { startViewer(); }
})();
</script>
</body>
</html>
