<h2>📋 Minecraft Codes — SQL (Step 1 of 2)</h2>
<p>1. Tap <b>Copy SQL</b> below.<br>2. Open the Supabase SQL Editor (link Muse gave in chat).<br>3. Paste → tap <b>Run</b>.<br>4. Tell Muse what it says (Success / error).</p>
<button id="cp">📋 Copy SQL</button>
<textarea id="sql" readonly>-- ============================================================
-- Minecraft Java &amp; Bedrock redeem codes (Diamond Shop add-on)
-- Run ONCE in the Supabase SQL Editor. Safe to re-run.
-- Codes live ONLY in public.mc_codes. RLS is ON: buyers (anon)
-- can NEVER read the table directly. A code is delivered only by
-- buy_minecraft_code() after a 1,220-diamond deduction, and is
-- re-shown to its buyer for 24 hours by get_my_minecraft_code().
-- The logged-in ADMIN can read sold rows (admin panel sales list)
-- to contact buyers by email for help &amp; support.
-- ============================================================

create table if not exists public.mc_codes (
  id bigint generated always as identity primary key,
  code text not null unique,
  status text not null default &#x27;unused&#x27; check (status in (&#x27;unused&#x27;, &#x27;sold&#x27;)),
  buyer_username text references public.profiles(username),
  buyer_email text,
  sold_at timestamptz,
  created_at timestamptz not null default now()
);

alter table public.mc_codes enable row level security;
-- buyers get NO direct access at all
revoke all on table public.mc_codes from anon;
revoke all on table public.mc_codes from authenticated;
grant select on public.mc_codes to authenticated;
-- only the logged-in admin can read rows directly (sales/support list)
drop policy if exists &quot;admin read mc_codes&quot; on public.mc_codes;
create policy &quot;admin read mc_codes&quot; on public.mc_codes
  for select to authenticated using (true);

-- ---------- buy one code: 1,220 diamonds, atomic ----------
create or replace function public.buy_minecraft_code(p_username text, p_email text)
returns json language plpgsql security definer set search_path = public as $$
declare
  u text := norm_username(p_username);
  em text := lower(trim(coalesce(p_email, &#x27;&#x27;)));
  v_price constant integer := 1220;
  r public.profiles%rowtype;
  c public.mc_codes%rowtype;
begin
  if u is null or length(u) &lt; 2 or length(u) &gt; 24 then
    raise exception &#x27;invalid username&#x27;;
  end if;
  if length(em) &lt; 5 or length(em) &gt; 254 or em !~ &#x27;^[^@\s]+@[^@\s]+\.[^@\s]+$&#x27; then
    raise exception &#x27;invalid email&#x27;;
  end if;
  select * into r from public.profiles where username = u for update;
  if not found then raise exception &#x27;profile not found&#x27;; end if;
  if exists (
    select 1 from public.mc_codes
    where buyer_username = u and status = &#x27;sold&#x27;
      and sold_at &gt; now() - interval &#x27;24 hours&#x27;
  ) then
    raise exception &#x27;already have active code&#x27;;
  end if;
  if r.diamonds &lt; v_price then raise exception &#x27;not enough diamonds&#x27;; end if;
  select * into c from public.mc_codes
  where status = &#x27;unused&#x27; order by id limit 1
  for update skip locked;
  if not found then raise exception &#x27;sold out&#x27;; end if;
  update public.profiles set diamonds = diamonds - v_price
  where username = u returning * into r;
  update public.mc_codes
  set status = &#x27;sold&#x27;, buyer_username = u, buyer_email = em, sold_at = now()
  where id = c.id returning * into c;
  return json_build_object(
    &#x27;ok&#x27;, true,
    &#x27;code&#x27;, c.code,
    &#x27;sold_at&#x27;, c.sold_at,
    &#x27;expires_at&#x27;, c.sold_at + interval &#x27;24 hours&#x27;,
    &#x27;diamonds&#x27;, r.diamonds
  );
end;
$$;

-- ---------- buyer&#x27;s own code, only inside the 24h window ----------
create or replace function public.get_my_minecraft_code(p_username text)
returns json language plpgsql security definer set search_path = public as $$
declare
  u text := norm_username(p_username);
  c public.mc_codes%rowtype;
begin
  select * into c from public.mc_codes
  where buyer_username = u and status = &#x27;sold&#x27;
    and sold_at &gt; now() - interval &#x27;24 hours&#x27;
  order by sold_at desc limit 1;
  if not found then
    return json_build_object(&#x27;ok&#x27;, true, &#x27;active&#x27;, false);
  end if;
  return json_build_object(
    &#x27;ok&#x27;, true, &#x27;active&#x27;, true,
    &#x27;code&#x27;, c.code,
    &#x27;sold_at&#x27;, c.sold_at,
    &#x27;expires_at&#x27;, c.sold_at + interval &#x27;24 hours&#x27;,
    &#x27;seconds_left&#x27;, floor(extract(epoch from (c.sold_at + interval &#x27;24 hours&#x27; - now())))::int,
    &#x27;email&#x27;, c.buyer_email
  );
end;
$$;

-- ---------- public stock count (never exposes codes) ----------
create or replace function public.mc_stock()
returns json language plpgsql security definer set search_path = public as $$
declare n integer;
begin
  select count(*) into n from public.mc_codes where status = &#x27;unused&#x27;;
  return json_build_object(&#x27;ok&#x27;, true, &#x27;left&#x27;, n);
end;
$$;

-- ---------- permissions ----------
grant execute on function public.buy_minecraft_code(text, text) to anon, authenticated;
grant execute on function public.get_my_minecraft_code(text) to anon, authenticated;
grant execute on function public.mc_stock() to anon, authenticated;

<script>
var b=document.getElementById('cp'),t=document.getElementById('sql');
b.addEventListener('click',function(){
  function done(){b.textContent='✅ Copied! Now paste it in the SQL Editor';b.classList.add('ok');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(done).catch(function(){t.select();document.execCommand('copy');done();});}
  else{t.select();document.execCommand('copy');done();}
});
